name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Les index générés sont commités et lus par les tests et le typecheck, qui tournent avant
      # le build : sans ce garde-fou, un catalogue modifié sans régénération passerait la CI en
      # étant validé contre un index périmé.
      - name: Index générés à jour
        run: |
          npm run gen:index
          npm run gen:quiz
          git diff --exit-code src/data/coursesIndex.generated.ts src/data/quizIndex.generated.ts

      - run: npm run lint

      - run: npm run validate

      - run: npm test

      - run: npm run typecheck

      - run: npm run build
