name: CI

on:
  push:
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo install --check
      - run: npm run typecheck
      - run: npm run verify:migration
      - run: npm test
      # Les composants repris avaient déjà des erreurs ESLint dans sankofa-mobile.
      # Elles restent visibles pendant la préparation, sans bloquer les autres contrôles.
      - name: Lint mobile (dette de migration existante)
        continue-on-error: true
        run: npm run lint
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Index générés à jour
        run: |
          npm run gen:index
          npm run gen:quiz
          git diff --exit-code src/data/coursesIndex.generated.ts src/data/quizIndex.generated.ts
      - run: npm run lint
      - run: npm run validate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
