[build]
  command = "npm run build"
  publish = "dist"

# Routage React Router en mode history : toute route profonde (/cours/:id, /biblio/:categoryId…)
# doit être servie par index.html, sinon un accès direct renvoie un 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Polices auto-hebergees depuis la Phase 7.5 (plus de CDN Google) : la CSP n'a besoin
# d'autoriser aucune origine externe. style-src garde 'unsafe-inline' car Vite injecte des
# styles en ligne et l'application utilise des attributs style= — le retirer casse le rendu.
# worker-src 'self' est necessaire au service worker de la PWA (vite-plugin-pwa).
# frame-ancestors 'none' fait doublon avec X-Frame-Options : le premier est la forme moderne,
# le second couvre les navigateurs anciens.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
